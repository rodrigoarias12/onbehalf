name: test
on: [push, pull_request]
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/voice.test.mjs
      - run: node test/corpus.mjs
      - run: node test/invite.test.mjs
      - run: node test/freebusy.test.mjs
      - run: node test/guard.test.mjs
      - run: node test/voice-corpus.test.mjs
      - run: node test/pipeline.test.mjs
      - run: node test/regressions.test.mjs
