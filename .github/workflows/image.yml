# Builds the Plow variant image (cloud/Dockerfile) for linux/amd64 and pushes it to GHCR.
# Runs on every push that touches the image inputs, and on demand. The runner is amd64, so
# there is no emulation, and GITHUB_TOKEN already has packages:write.
name: image
on:
  push:
    branches: [main]
    paths: ['cloud/**', 'plugin/**', 'skills/**', 'AGENTS.md', '.github/workflows/image.yml']
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/onbehalf:v1
            ghcr.io/${{ github.repository_owner }}/onbehalf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest
        run: echo "pushed ghcr.io/${{ github.repository_owner }}/onbehalf:v1"
